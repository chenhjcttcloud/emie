server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: Asia/Shanghai

app:
  upload:
    dir: ./uploads
  log-archive:
    dir: ./logs/archive

---
# === 开发环境：远程测试 MySQL（47.119.179.230） ===
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://47.119.179.230:3306/designpmtest?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: emietest
    password: MYSQL_emie
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: true

