---
# === 生产环境：必须显式提供全部 DESIGNPM_DB_* 变量 ===
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DESIGNPM_DB_HOST}:3306/${DESIGNPM_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DESIGNPM_DB_USE_SSL:true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DESIGNPM_DB_USER}
    password: ${DESIGNPM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512

---
# === 默认环境：安全的本机 H2；生产必须明确启用 prod profile ===
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:file:./data/designpm-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512
