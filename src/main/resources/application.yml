server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never

spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      # 本项目只使用 StringRedisTemplate，不使用 Spring Data Redis Repository。
      repositories:
        enabled: false
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  main:
    keep-alive: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: Asia/Shanghai

app:
  db:
    pool:
      isolation:
    # 完成后台事务迁移前保持关闭，避免产生未接入的“假隔离”连接池。
        enabled: ${APP_DB_POOL_ISOLATION_ENABLED:false}
        background:
          jdbc-url: ${APP_DB_BACKGROUND_JDBC_URL:}
          username: ${APP_DB_BACKGROUND_DB_USER:}
          password: ${APP_DB_BACKGROUND_DB_PASSWORD:}
          maximum-pool-size: ${APP_DB_BACKGROUND_POOL_MAX:20}
          minimum-idle: ${APP_DB_BACKGROUND_POOL_MIN:1}
          connection-timeout: ${APP_DB_BACKGROUND_CONNECTION_TIMEOUT:2000}
          validation-timeout: ${APP_DB_BACKGROUND_VALIDATION_TIMEOUT:2000}
          idle-timeout: ${APP_DB_BACKGROUND_IDLE_TIMEOUT:300000}
          max-lifetime: ${APP_DB_BACKGROUND_MAX_LIFETIME:1200000}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  feishu:
    sync-worker-enabled: ${APP_FEISHU_SYNC_WORKER_ENABLED:true}
    reconcile-delay-ms: ${APP_FEISHU_RECONCILE_DELAY_MS:3600000}
    reconcile-initial-delay-ms: ${APP_FEISHU_RECONCILE_INITIAL_DELAY_MS:300000}
  upload:
    dir: ./uploads
  preview:
    cache-dir: ${APP_PREVIEW_CACHE_DIR:./uploads/preview-cache}
    converter-url: ${APP_PREVIEW_CONVERTER_URL:http://127.0.0.1:3000}
    max-source-bytes: ${APP_PREVIEW_MAX_SOURCE_BYTES:52428800}
    max-cache-bytes: ${APP_PREVIEW_MAX_CACHE_BYTES:2147483648}
    conversion-timeout-seconds: ${APP_PREVIEW_TIMEOUT_SECONDS:120}
  log-archive:
    dir: ./logs/archive

---
# === 开发环境：专用测试 MySQL，凭据只从本机环境变量读取 ===
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DESIGNPM_TEST_DB_HOST}:3306/${DESIGNPM_TEST_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DESIGNPM_TEST_DB_USE_SSL:true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DESIGNPM_TEST_DB_USER}
    password: ${DESIGNPM_TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: ${DESIGNPM_DB_CONNECTION_TIMEOUT:2000}
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 2000
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

app:
  feishu:
    # 共享测试库可能含有待处理任务；本地开发须显式开启后才允许调用飞书。
    sync-worker-enabled: ${APP_FEISHU_SYNC_WORKER_ENABLED:false}

---
# === 共享测试 MySQL：必须显式提供全部 DESIGNPM_TEST_DB_* 变量 ===
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${DESIGNPM_TEST_DB_HOST}:3306/${DESIGNPM_TEST_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DESIGNPM_TEST_DB_USE_SSL:true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DESIGNPM_TEST_DB_USER}
    password: ${DESIGNPM_TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: ${DESIGNPM_DB_CONNECTION_TIMEOUT:2000}
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 2000
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

---
# === 生产环境：必须显式提供全部 DESIGNPM_DB_* 变量 ===
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DESIGNPM_DB_HOST}:3306/${DESIGNPM_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DESIGNPM_DB_USE_SSL:true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DESIGNPM_DB_USER}
    password: ${DESIGNPM_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DESIGNPM_DB_POOL_MAX:20}
      minimum-idle: ${DESIGNPM_DB_POOL_MIN:3}
      connection-timeout: ${DESIGNPM_DB_CONNECTION_TIMEOUT:2000}
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 2000
      keepalive-time: 120000
      leak-detection-threshold: ${DESIGNPM_DB_LEAK_DETECTION_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:100}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:200}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512

---
# === 默认环境：安全的本机 H2；生产必须明确启用 prod profile ===
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:file:./data/designpm-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: ${DESIGNPM_DB_CONNECTION_TIMEOUT:2000}
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 2000
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/xml
    min-response-size: 512

# === 积分系统 ===
points:
  # 积分不受任务创建时间限制，所有符合规则的正式送审任务均可入账。
