<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品管理系统 - EMIE</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/css/app.css?v=28">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" style="display:none;">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🎨</div>
      <h1 class="login-title">产品管理系统</h1>
      <p class="login-subtitle">EMIE Design Project Management</p>
      <button id="feishuLoginBtn" class="btn btn-outline btn-lg" style="width:100%;justify-content:center;color:#3370FF;border-color:#3370FF;" data-emie-onclick="handleFeishuLogin()">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;margin-right:4px;" fill="#3370FF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.41 15.41L6.41 13l1.41-1.41 3.18 3.18 5.59-5.59L18 10.59l-7.41 7.42z"/></svg>
        飞书登录
      </button>
      <div id="loginError" style="color:var(--danger);font-size:13px;text-align:center;margin-top:12px;display:none;"></div>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="appContainer" style="display:none;">
  <div class="header">
    <div class="header-left">
      <button class="hamburger" id="hamburgerBtn" data-emie-onclick="toggleMobileSidebar()" aria-label="菜单" aria-expanded="false" aria-controls="sidebarContainer">☰</button>
      <div class="logo">🎨 <span class="logo-text">产品管理系统</span><span class="logo-sub">Product Management</span></div>
    </div>
    <div class="header-right">
      <span class="user-display" id="userDisplay"></span>
      <button class="btn btn-outline btn-sm logout-btn" data-emie-onclick="handleLogout()">退出</button>
    </div>
  </div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebarContainer"></aside>
    <!-- 移动端侧栏遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay" data-emie-onclick="closeMobileSidebar()"></div>
    <main class="main-content" id="mainContent"></main>
  </div>
</div>

<script type="module" src="/js/bootstrap.js?v=213"></script>
</body>
</html>
