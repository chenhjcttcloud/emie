<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计项目管理系统 - EMIE</title>
<link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" style="display:none;">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🎨</div>
      <h1 class="login-title">设计项目管理系统</h1>
      <p class="login-subtitle">EMIE Design Project Management</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">账号</label>
          <input type="text" class="form-input" id="loginId" placeholder="用户ID / 手机号 / 邮箱" required autocomplete="username" style="text-align:center;">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="输入密码" required autocomplete="current-password" style="text-align:center;">
        </div>
        <div id="loginError" style="color:var(--danger);font-size:13px;text-align:center;margin-bottom:12px;display:none;"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">登 录</button>
      </form>
      <div style="text-align:center;margin-top:14px;">
        <a onclick="showRegister()" style="color:var(--primary);font-size:13px;text-decoration:none;cursor:pointer;">还没有账号？立即注册 →</a>
      </div>
    </div>
  </div>
</div>

<!-- 注册页 -->
<div id="registerPage" style="display:none;">
  <div class="login-container">
    <div class="login-card" style="max-width:420px;">
      <div class="login-logo">🎨</div>
      <h1 class="login-title">注册账号</h1>
      <p class="login-subtitle">加入设计项目管理系统</p>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">用户ID</label>
          <input type="text" class="form-input" id="regId" placeholder="设置您的用户ID" required style="text-align:center;">
        </div>
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input type="text" class="form-input" id="regName" placeholder="您的真实姓名" required style="text-align:center;">
        </div>
        <div class="form-group">
          <label class="form-label">角色</label>
          <select class="form-select" id="regRole" style="text-align:center;">
            <option value="sales">销售</option>
            <option value="planner">产品企划</option>
            <option value="designer">设计师</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" required style="text-align:center;">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱地址" required style="text-align:center;">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">图形验证码</label>
          <div style="display:flex;gap:8px;align-items:stretch;">
            <input type="text" class="form-input" id="regCaptcha" placeholder="输入验证码" required maxlength="4" style="text-align:center;flex:1;">
            <img id="captchaImg" src="" onclick="refreshCaptcha()" style="border-radius:6px;cursor:pointer;height:38px;border:1px solid var(--gray-300);" title="点击刷新">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱验证码</label>
          <div style="display:flex;gap:8px;">
            <input type="text" class="form-input" id="regEmailCode" placeholder="输入6位验证码" required maxlength="6" style="text-align:center;flex:1;">
            <button type="button" class="btn btn-outline" id="emailBtn" onclick="sendEmailCode()" style="white-space:nowrap;flex-shrink:0;">获取验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="regPassword" placeholder="至少6位密码" required minlength="6" style="text-align:center;">
        </div>
        <div id="registerError" style="color:var(--danger);font-size:13px;text-align:center;margin-bottom:12px;display:none;"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">注 册</button>
      </form>
      <div style="text-align:center;margin-top:14px;">
        <a onclick="showLoginPage()" style="color:var(--gray-400);font-size:13px;text-decoration:none;cursor:pointer;">已有账号？返回登录</a>
      </div>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="appContainer" style="display:none;">
  <div class="header">
    <div class="header-left">
      <div class="logo">🎨 设计项目管理<span>Design Project Management</span></div>
    </div>
    <div class="header-right">
      <span style="font-size:13px;color:var(--gray-500);" id="userDisplay"></span>
      <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出登录</button>
    </div>
  </div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent"></main>
  </div>
</div>

<script src="/js/app.js?v=69"></script>
</body>
</html>
