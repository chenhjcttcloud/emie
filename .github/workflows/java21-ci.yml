name: Java 21 CI

on:
  push:
    branches: [project_manager_system]
  pull_request:
    branches: [project_manager_system]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Build and test
        run: ./mvnw -B clean package
