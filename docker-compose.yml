services:
  app:
    build: .
    container_name: emie-app
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DESIGNPM_DB_HOST:?Set DESIGNPM_DB_HOST}:3306/${DESIGNPM_DB_NAME:?Set DESIGNPM_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DESIGNPM_DB_USER:?Set DESIGNPM_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DESIGNPM_DB_PASSWORD:?Set DESIGNPM_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx384m -Xms256m -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=96m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof
    mem_limit: 640m
    mem_reservation: 512m
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /root/.lark-cli:/root/.lark-cli
