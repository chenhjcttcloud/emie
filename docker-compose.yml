services:
  app:
    build: .
    container_name: emie-app
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://47.119.179.230:3306/designpm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: emie
      SPRING_DATASOURCE_PASSWORD: MYSQL_emie
      JAVA_TOOL_OPTIONS: -Xmx384m -Xms256m -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=96m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof
    mem_limit: 640m
    mem_reservation: 512m
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /root/.lark-cli:/root/.lark-cli
