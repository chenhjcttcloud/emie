services:
  app:
    build: .
    container_name: emie-app
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_ADDRESS: 0.0.0.0
      EMIE_EMERGENCY_ADMIN_USER_ID: ${EMIE_EMERGENCY_ADMIN_USER_ID:-}
      EMIE_EMERGENCY_ADMIN_PASSWORD: ${EMIE_EMERGENCY_ADMIN_PASSWORD:-}
      APP_DB_POOL_ISOLATION_ENABLED: ${APP_DB_POOL_ISOLATION_ENABLED:-true}
      APP_DB_BACKGROUND_JDBC_URL: jdbc:mysql://${DESIGNPM_DB_HOST:?Set DESIGNPM_DB_HOST}:3306/${DESIGNPM_DB_NAME:?Set DESIGNPM_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      APP_DB_BACKGROUND_DB_USER: ${DESIGNPM_DB_USER:?Set DESIGNPM_DB_USER}
      APP_DB_BACKGROUND_DB_PASSWORD: ${DESIGNPM_DB_PASSWORD:?Set DESIGNPM_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DESIGNPM_DB_HOST:?Set DESIGNPM_DB_HOST}:3306/${DESIGNPM_DB_NAME:?Set DESIGNPM_DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DESIGNPM_DB_USER:?Set DESIGNPM_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DESIGNPM_DB_PASSWORD:?Set DESIGNPM_DB_PASSWORD}
      APP_PREVIEW_CONVERTER_URL: http://127.0.0.1:3000
      APP_PREVIEW_MAX_SOURCE_BYTES: ${APP_PREVIEW_MAX_SOURCE_BYTES:-52428800}
      APP_PREVIEW_MAX_CACHE_BYTES: ${APP_PREVIEW_MAX_CACHE_BYTES:-2147483648}
      APP_PREVIEW_TIMEOUT_SECONDS: ${APP_PREVIEW_TIMEOUT_SECONDS:-120}
      GROWTH_OS_BASE_URL: ${GROWTH_OS_BASE_URL:-}
      GROWTH_OS_SCORE_TOKEN: ${GROWTH_OS_SCORE_TOKEN:-}
      VISUAL_AI_ENABLED: ${VISUAL_AI_ENABLED:-false}
      VISUAL_AI_BASE_URL: ${VISUAL_AI_BASE_URL:-https://api.moonshot.cn/v1}
      VISUAL_AI_MODEL: ${VISUAL_AI_MODEL:-kimi-k2.6}
      VISUAL_AI_API_KEY: ${VISUAL_AI_API_KEY:-}
      VISUAL_AI_ENCRYPTION_KEY: ${VISUAL_AI_ENCRYPTION_KEY:-}
      ASSISTANT_TRUSTED_BASE_URLS: ${ASSISTANT_TRUSTED_BASE_URLS:-}
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -Xmx512m -Xms128m -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=192m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof
    mem_limit: 768m
    mem_reservation: 512m
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /root/.lark-cli:/root/.lark-cli

  preview-converter:
    image: gotenberg/gotenberg:8
    container_name: emie-preview-converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
